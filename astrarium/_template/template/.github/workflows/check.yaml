name: Astrarium check

on:
  pull_request:
    paths:
      - astrarium.yaml
      - topology.yaml
      - pyproject.toml
      - uv.lock
      - secrets/**
      - .sops.yaml
      - runes/**
      - .github/**

permissions:
  contents: read

concurrency:
  group: astrarium-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_INDEX_PHOTON_USERNAME: __token__

jobs:
  plan:
    name: Plan xray builds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.builds.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install tool stack
        env:
          UV_INDEX_PHOTON_PASSWORD: ${{ secrets.PHOTON_READ_TOKEN }}
        run: uv sync --frozen
      - name: List xray builds
        id: builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matrix=$(uv run arium ci xray-builds --for check --json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-xray:
    name: Build xray ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Restore cached build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: xray-out
          key: xray-${{ matrix.sha }}-${{ matrix.arch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: XTLS/Xray-core
          ref: ${{ matrix.sha }}
          path: xray-core
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version-file: xray-core/go.mod
          cache-dependency-path: xray-core/go.sum
      - name: Build xray at pinned commit
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: xray-core
        env:
          SHA: ${{ matrix.sha }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          mkdir -p ../xray-out
          CGO_ENABLED=0 GOOS=linux go build -o ../xray-out/xray -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags "-s -w -buildid=$SHA -X github.com/xtls/xray-core/core.build=$SHA" ./main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xray-${{ matrix.arch }}
          path: xray-out/xray
          if-no-files-found: error
          retention-days: 3

  check:
    name: Check configs
    needs:
      - plan
      - build-xray
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-xray.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install tool stack
        env:
          UV_INDEX_PHOTON_PASSWORD: ${{ secrets.PHOTON_READ_TOKEN }}
        run: uv sync --frozen
      - name: Pick geo data cache key
        id: today
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache geo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .astrarium/cache/geodata
          key: geodata-${{ steps.today.outputs.day }}
          restore-keys: geodata-
      - name: Download xray builds
        if: needs.plan.outputs.matrix != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xray-*
          path: xray-artifacts
      - name: Run arium repo check
        env:
          BASE_REF: ${{ github.base_ref }}
          HAPROXY_IMAGE: ${{ vars.ASTRARIUM_HAPROXY_IMAGE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          args=(--base "origin/$BASE_REF" --report-md check-report.md)
          if [ -n "$HAPROXY_IMAGE" ]; then args+=(--haproxy-image "$HAPROXY_IMAGE"); fi
          for dir in xray-artifacts/xray-*; do
            [ -f "$dir/xray" ] || continue
            chmod +x "$dir/xray"
            args+=(--artifact "${dir#xray-artifacts/xray-}=$PWD/$dir/xray")
          done
          uv run arium repo check "${args[@]}"
      - name: Publish job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f check-report.md ]; then cat check-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep report for comment job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-report
          path: check-report.md
          if-no-files-found: ignore
          retention-days: 3

  comment:
    name: Post report
    needs:
      - plan
      - build-xray
      - check
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: check-report
          path: report
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build-xray.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- astrarium-check -->';
            const path = 'report/check-report.md';
            const results = [
              ['plan', process.env.PLAN_RESULT],
              ['build-xray', process.env.BUILD_RESULT],
              ['check', process.env.CHECK_RESULT],
            ];
            const failed = results.filter(([, result]) => result !== 'success' && result !== 'skipped');
            const ended = (failed.length ? failed : results.slice(-1))
              .map(([job, result]) => `\`${job}\` job ended with \`${result}\``)
              .join(', ');
            let body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `${marker}\n## Astrarium check\n\nNo report for \`${process.env.HEAD_SHA}\`: ${ended}, see workflow logs.\n`;
            if (body.length > 65000) body = body.slice(0, 65000) + '\n\n(truncated)\n';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
