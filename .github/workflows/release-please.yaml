name: 🚀 Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: 🔖 Create release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    name: 📦 Build distribution
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - run: uv build

      - name: Verify build matches released version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ ! -f "dist/astrarium-${VERSION}.tar.gz" ]; then
            echo "::error::Released version ${VERSION} does not match built artifacts. dist contains:"
            ls -1 dist/
            exit 1
          fi

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  attest-artifacts:
    name: 🔐 Generate artifact attestations
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-photon:
    name: 📤 Publish to photon
    needs: [release-please, build, attest-artifacts]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: photon
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PHOTON_PUBLISH_TOKEN }}
          PUBLISH_URL: ${{ vars.PHOTON_PUBLISH_URL }}
          CHECK_URL: ${{ vars.PHOTON_INDEX_URL }}
        run: |
          uv auth login "$CHECK_URL" --token "$UV_PUBLISH_TOKEN"
          uv publish --publish-url "$PUBLISH_URL" --check-url "$CHECK_URL" --no-attestations

  finalize-release:
    name: 🚀 Attach assets and publish release
    needs: [release-please, build, attest-artifacts, publish-photon]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Attach assets to draft release and publish it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPLOAD_URL: ${{ needs.release-please.outputs.upload_url }}
        run: |
          set -euo pipefail
          upload_base="${UPLOAD_URL%%\{*}" # strip {?name,label} template from upload URL
          release_id="$(printf '%s' "$upload_base" | sed -E 's#.*/releases/([0-9]+)/assets#\1#')"
          if ! printf '%s' "$release_id" | grep -qE '^[0-9]+$'; then
            echo "::error::Could not parse a release id from upload_url='${UPLOAD_URL}'"
            exit 1
          fi
          for f in dist/*; do
            name="$(basename "$f")"
            existing_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
              --jq ".[] | select(.name == \"${name}\") | .id" 2>/dev/null || true)"
            if [ -n "${existing_id}" ]; then
              echo "Asset ${name} already exists; skipping upload"
              continue
            fi
            echo "Uploading ${name} to release ${release_id}"
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${upload_base}?name=${name}" \
              --data-binary @"${f}"
          done
          echo "Publishing release ${release_id}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false

  release-pr:
    name: 🔁 Open next release PR
    needs: [release-please, publish-photon, finalize-release]
    if: |
      always()
      && needs.release-please.result == 'success'
      && (needs.release-please.outputs.release_created != 'true'
          || (needs.publish-photon.result == 'success' && needs.finalize-release.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Rebase open release PRs onto main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--branches-")) | .number' |
          while read -r pr; do
            [ -n "$pr" ] || continue
            gh pr update-branch "$pr" -R "$GITHUB_REPOSITORY" --rebase
          done
