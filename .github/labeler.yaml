version: 1
labels:
  # --- by PR "Type of change" checklist ---
  - label: "feature"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Feature\b'
  - label: "bug"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Bug fix\b'
  - label: "enhancement"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Enhancement\b'
  - label: "refactor"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Refactor\b'
  - label: "breaking-change"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Breaking change\b'
  - label: "security"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\**Security\b'

  # --- by changed paths ---
  - label: "docs"
    files:
      - "^docs/"
      - '^README\.md$'
  - label: "ci-cd"
    files:
      - '^\.github/'
  - label: "tests"
    files:
      - "^tests/"
  - label: "dependencies"
    files:
      - '^uv\.lock$'
  - label: "templates"
    files:
      - "^astrarium/_template/"
  - label: "payloads"
    files:
      - "^astrarium/payloads/"
  - label: "runes"
    files:
      - "^astrarium/runes/"
  - label: "core"
    files:
      - "^astrarium/core/"
  - label: "manifest"
    files:
      - "^astrarium/components/manifest/"
      - "^astrarium/presets/"
  - label: "topology"
    files:
      - "^astrarium/components/topology/"
  - label: "secrets"
    files:
      - "^astrarium/components/secrets/"
  - label: "keys"
    files:
      - "^astrarium/components/keys/"
  - label: "rollout"
    files:
      - "^astrarium/components/rollout/"
  - label: "versions"
    files:
      - "^astrarium/components/versions/"
  - label: "status"
    files:
      - "^astrarium/components/status/"
  - label: "doctor"
    files:
      - "^astrarium/components/doctor/"
  - label: "check"
    files:
      - "^astrarium/components/check/"
  - label: "init"
    files:
      - "^astrarium/components/init/"
  - label: "notify"
    files:
      - "^astrarium/components/notify/"
  - label: "inventory"
    files:
      - "^astrarium/components/inventory/"
  - label: "sshcfg"
    files:
      - "^astrarium/components/sshcfg/"
  - label: "cli"
    files:
      - '^astrarium/components/[^/]+/component\.py$'
      - '^astrarium/app\.py$'
      - '^astrarium/__main__\.py$'
