[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "astrarium"
description = "Deploy and manage Conglomerate fleets"
readme = "README.md"
maintainers = [ { name = "wlix13" } ]
authors = [ { name = "wlix13" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "copier>=9.4,<10",
  "cryptography>=44",
  "hexrift>=0.13,<0.14",
  "httpx>=0.28,<1",
  "nullforge>=0.3.4,<0.5",
  "packaging>=24",
  "paramiko>=3.4,<6",
  "pydantic>=2.11",
  "pyinfra>=3.11,<4",
  "pyyaml>=6",
  "rich>=14",
  "rich-click>=1.9",
  "ruamel-yaml>=0.18",
]
scripts.arium = "astrarium.__main__:main"
scripts.astrarium = "astrarium.__main__:main"

[dependency-groups]
dev = [
  { include-group = "tests" },
  "deptry",
  "import-linter",
  "poethepoet",
  "prek",
  "ruff",
  "ty",
]
tests = [
  "pytest",
  "pytest-cov",
  "pytest-randomly",
  "pytest-sugar",
]

[tool.hatch]
version.path = "astrarium/__init__.py"
build.targets.wheel.packages = [ "astrarium" ]

[tool.ruff]
line-length = 120
lint.select = [ "E", "F", "I", "N", "S", "UP", "W", "YTT" ]
lint.ignore = [
  "N818", # errors named by failure mode (InvalidManifest, Refused), no Error suffix
]
lint.per-file-ignores."tests/*" = [
  "S101", # assert in tests
  "S105", # fake secrets in tests
  "S106", # fake secrets in tests
  "S108", # tmp paths in tests
  "S603", # subprocess with test-controlled argv
  "S607", # git and tools from PATH in tests
]
lint.isort.lines-after-imports = 2
lint.pyflakes.allowed-unused-imports = [
  "astrarium.app.AstrariumApp", # named only in BaseController["AstrariumApp"] under TYPE_CHECKING
]

[tool.ty]
environment.root = [ "." ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra -q --tb=short --cov=astrarium --strict-markers"
ini_options.markers = [
  "component: tmp_path, subprocess fakes",
  "integration: disposable host from ASTRARIUM_IT_* environment",
  "payload: bash payloads against a fake root (Linux with GNU coreutils and util-linux only)",
  "unit: pure, no I/O",
]

[tool.importlinter]
root_package = "astrarium"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "spine (app -> components -> core)"
type = "layers"
layers = [
  "astrarium.app",
  "astrarium.components",
  "astrarium.core",
]

[[tool.importlinter.contracts]]
name = "errors, repo and runtime stay below components and core"
type = "forbidden"
source_modules = [ "astrarium.errors", "astrarium.repo", "astrarium.runtime" ]
forbidden_modules = [ "astrarium.app", "astrarium.components", "astrarium.core" ]

[[tool.importlinter.contracts]]
name = "runes run inside pyinfra and import no astrarium CLI code"
type = "forbidden"
source_modules = [ "astrarium.runes" ]
forbidden_modules = [ "astrarium.app", "astrarium.components", "astrarium.core" ]

[tool.poe]
executor.type = "uv"
tasks.format = "ruff format --check ."
tasks."format:fix" = "ruff format ."
tasks.lint = "ruff check ."
tasks."lint:fix" = "ruff check --fix ."
tasks.typecheck = "ty check"
tasks.lint-imports = "lint-imports --no-logo"
tasks.deptry = "deptry ."
tasks.check = [ "format", "lint", "typecheck", "lint-imports", "deptry" ]
tasks.tests = "pytest -m 'not integration'"
tasks."tests:integration" = "pytest -m integration"
tasks."tests:coverage" = "pytest -m 'not integration' --cov-report=term --cov-report=html --cov-report=xml"
